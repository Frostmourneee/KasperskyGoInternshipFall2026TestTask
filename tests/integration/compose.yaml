name: threat-info-tests

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: threats_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:15432:5432"
    # Это одноразовая тестовая БД: данные не сохраняются на диск.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d threats_test"]
      interval: 1s
      timeout: 3s
      retries: 30
