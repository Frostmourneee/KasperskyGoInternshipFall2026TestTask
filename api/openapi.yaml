openapi: 3.0.3
info:
  title: Information Exchange Service
  version: 1.0.0
  description: |
    Store and retrieve threat information by file MD5. The service stores
    client-provided information; it does not scan files or assess threats.

    All operations require the same API key and grant the same permissions.
    Requests and responses use JSON. Write requests require
    Content-Type: application/json. Unknown request properties are rejected.

    MD5 values are case-insensitive and are stored and returned in lowercase.
    All timestamps are generated by the server and returned as UTC RFC 3339
    strings with a Z suffix. Error responses never expose database details,
    credentials, or other internal information.
servers:
  - url: http://localhost:8080
    description: Local development. Publish the HTTP port on loopback only.
security:
  - ApiKeyAuth: []
tags:
  - name: Threats
    description: Threat records identified by file MD5.
paths:
  /info/{md5}:
    parameters:
      - $ref: '#/components/parameters/Md5Path'
    get:
      tags:
        - Threats
      summary: Get threat information by MD5
      description: |
        Return the complete record for the MD5. Reading a record does not
        change it or its timestamps. Return 404 if the record does not exist.
      operationId: getInfoByMd5
      responses:
        '200':
          description: Threat found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
              examples:
                threat:
                  $ref: '#/components/examples/Threat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Threats
      summary: Replace threat information by MD5
      description: |
        Replace all client-managed fields of an existing record. This operation
        does not create a missing record; it returns 404 instead.

        name is required. Omitted description becomes an empty string.
        Omitted threat_type and severity become unknown. Omitted or null
        file_size becomes unknown. Zero is a known file size.

        md5 and created_at remain unchanged. updated_at changes only when the
        stored client-managed values change after applying these defaults.
        Repeating the same replacement preserves updated_at. For concurrent
        updates, the last successful write wins.

        md5, created_at, and updated_at are not allowed in the request body.
      operationId: updateThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
            examples:
              clearOptionalFields:
                summary: Replace the name and reset all optional fields
                value:
                  name: Trojan.Win32.Generic
              fullReplacement:
                summary: Replace every client-managed field
                value:
                  name: Trojan.Win32.Generic
                  description: Collects saved browser passwords.
                  threat_type: trojan
                  severity: high
                  file_size: 4096
      responses:
        '200':
          description: Threat replaced. An unchanged replacement also returns 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
              examples:
                threat:
                  $ref: '#/components/examples/Threat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /info:
    post:
      tags:
        - Threats
      summary: Create a threat record
      description: |
        Create a record with a unique MD5. MD5 uniqueness is case-insensitive,
        including concurrent requests. Return 409 if the MD5 already exists.

        md5 and name are required. Omitted description becomes an empty string.
        Omitted threat_type and severity become unknown. Omitted or null
        file_size becomes unknown. Zero is a known file size.

        The server sets created_at and updated_at to the same creation time.
        Neither timestamp is allowed in the request body.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
            examples:
              minimal:
                summary: Create a record using defaults for optional fields
                value:
                  md5: d41d8cd98f00b204e9800998ecf8427e
                  name: Trojan.Win32.Generic
              full:
                summary: Create a record with an unknown file size
                value:
                  md5: D41D8CD98F00B204E9800998ECF8427E
                  name: Trojan.Win32.Generic
                  description: Collects saved browser passwords.
                  threat_type: trojan
                  severity: high
                  file_size: null
      responses:
        '201':
          description: Threat created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
              examples:
                threat:
                  $ref: '#/components/examples/Threat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Shared API key configured by the service operator.
  parameters:
    Md5Path:
      name: md5
      in: path
      required: true
      description: File MD5. Uppercase and lowercase hexadecimal digits are accepted.
      schema:
        $ref: '#/components/schemas/Md5'
  schemas:
    Md5:
      type: string
      pattern: '^[a-fA-F0-9]{32}$'
      description: File MD5 consisting of 32 hexadecimal characters.
      example: d41d8cd98f00b204e9800998ecf8427e
    CanonicalMd5:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: Immutable file MD5 in lowercase.
      example: d41d8cd98f00b204e9800998ecf8427e
    ThreatName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\x00]*[^ \t\r\n\f\v\x00][^\x00]*$'
      description: Threat name. Must contain a character other than ASCII whitespace. NUL is not allowed. Preserved as submitted.
      example: Trojan.Win32.Generic
    ThreatDescription:
      type: string
      maxLength: 2000
      pattern: '^[^\x00]*$'
      default: ''
      description: Human-readable threat description. Omission means an empty string; null and NUL are invalid.
      example: Collects saved browser passwords.
    ThreatType:
      type: string
      enum:
        - trojan
        - worm
        - ransomware
        - spyware
        - other
        - unknown
      default: unknown
      description: Primary threat category supplied by the client. Omission means unknown; null is invalid.
      example: trojan
    Severity:
      type: string
      enum:
        - unknown
        - low
        - medium
        - high
      default: unknown
      description: Severity assessed by the client. Omission means unknown; null is invalid.
      example: high
    FileSize:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      nullable: true
      description: File size in bytes. Omission or null means unknown; zero is a known size.
      example: 4096
    ThreatCreateRequest:
      type: object
      additionalProperties: false
      required:
        - md5
        - name
      properties:
        md5:
          $ref: '#/components/schemas/Md5'
        name:
          $ref: '#/components/schemas/ThreatName'
        description:
          $ref: '#/components/schemas/ThreatDescription'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        file_size:
          $ref: '#/components/schemas/FileSize'
    ThreatUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/ThreatName'
        description:
          $ref: '#/components/schemas/ThreatDescription'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        file_size:
          $ref: '#/components/schemas/FileSize'
    ThreatResponse:
      type: object
      additionalProperties: false
      required:
        - md5
        - name
        - description
        - threat_type
        - severity
        - file_size
        - created_at
        - updated_at
      properties:
        md5:
          $ref: '#/components/schemas/CanonicalMd5'
        name:
          $ref: '#/components/schemas/ThreatName'
        description:
          $ref: '#/components/schemas/ThreatDescription'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        file_size:
          $ref: '#/components/schemas/FileSize'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Server creation time in UTC RFC 3339 format. Never changes.
          example: '2026-11-06T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Server time of the last data change in UTC RFC 3339 format. Initially equals created_at.
          example: '2026-11-06T10:00:00Z'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: Short error message safe to return to clients.
          example: Threat not found
        details:
          type: string
          description: Optional safe details. Never includes database errors, credentials, or internal information.
          example: No threat matches the provided MD5.
  responses:
    BadRequest:
      description: |
        Invalid MD5, missing required body or field, malformed JSON, unknown
        property, or a value that violates the schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Invalid request
            details: name must contain a character other than ASCII whitespace.
    Unauthorized:
      description: The API key is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthorized
    NotFound:
      description: No threat matches the provided MD5.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Threat not found
    Conflict:
      description: A threat with this MD5 already exists, regardless of letter case.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Threat already exists
    ContentTooLarge:
      description: The request body exceeds the limit configured by the service operator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Request body too large
    UnsupportedMediaType:
      description: A nonempty write request has a missing or unsupported Content-Type. Use application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unsupported media type
            details: Use Content-Type application/json.
    TooManyRequests:
      description: The shared rate limit for this service instance has been exceeded. Limits are configurable.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying. Always included in this response.
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Too many requests
    InternalServerError:
      description: An unexpected server error. Technical details are logged and are not returned to the client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Internal server error
  examples:
    Threat:
      summary: A complete record with an unknown file size
      value:
        md5: d41d8cd98f00b204e9800998ecf8427e
        name: Trojan.Win32.Generic
        description: Collects saved browser passwords.
        threat_type: trojan
        severity: high
        file_size: null
        created_at: '2026-11-06T10:00:00Z'
        updated_at: '2026-11-06T10:00:00Z'
