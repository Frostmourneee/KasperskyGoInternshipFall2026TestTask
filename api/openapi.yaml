openapi: 3.0.3
info:
  title: Information Exchange Service
  version: 1.0.0
  description: |
    Хранение и получение сведений об угрозах по MD5 файла. Сервис сохраняет
    сведения клиента; он не сканирует файлы и не оценивает угрозы.

    Все операции требуют общий API-ключ и предоставляют одинаковые права.
    Запросы и ответы используют JSON. Запросы на запись требуют
    Content-Type: application/json. Неизвестные поля запроса отклоняются.

    Регистр символов MD5 не учитывается; значение хранится и возвращается
    в нижнем регистре. Временные метки создаёт сервер и возвращает в UTC
    в формате RFC 3339 с суффиксом Z. Ответы об ошибках не раскрывают
    сведения о БД, учётные данные или другие внутренние сведения.
servers:
  - url: http://localhost:8080
    description: Локальная разработка. Публикуйте HTTP-порт только на loopback-интерфейсе.
security:
  - ApiKeyAuth: []
tags:
  - name: Threats
    description: Записи об угрозах, идентифицируемые по MD5 файла.
paths:
  /info/{md5}:
    parameters:
      - $ref: '#/components/parameters/Md5Path'
    get:
      tags:
        - Threats
      summary: Получить сведения об угрозе по MD5
      description: |
        Возвращает полную запись по MD5. Чтение не изменяет запись
        или её временные метки. Если записи нет, возвращается 404.
      operationId: getInfoByMd5
      responses:
        '200':
          description: Угроза найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
              examples:
                threat:
                  $ref: '#/components/examples/Threat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Threats
      summary: Заменить сведения об угрозе по MD5
      description: |
        Заменяет все управляемые клиентом поля существующей записи.
        Если записи нет, возвращает 404 и не создаёт её.

        Поле name обязательно. Отсутствующее description заменяется пустой
        строкой, threat_type и severity — значением unknown. Отсутствующее
        или равное null поле file_size означает неизвестный размер.
        Ноль означает известный размер файла.

        md5 и created_at не меняются. updated_at меняется только при изменении
        сохранённых данных после применения значений по умолчанию.
        Повтор одинакового запроса сохраняет updated_at. При одновременных
        обновлениях сохраняется результат последней успешной записи.

        Поля md5, created_at и updated_at запрещены в теле запроса.
      operationId: updateThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
            examples:
              clearOptionalFields:
                summary: Заменить имя и сбросить все необязательные поля
                value:
                  name: Trojan.Win32.Generic
              fullReplacement:
                summary: Заменить все управляемые клиентом поля
                value:
                  name: Trojan.Win32.Generic
                  description: Collects saved browser passwords.
                  threat_type: trojan
                  severity: high
                  file_size: 4096
      responses:
        '200':
          description: Угроза обновлена. Если данные не изменились, также возвращается 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
              examples:
                threat:
                  $ref: '#/components/examples/Threat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /info:
    post:
      tags:
        - Threats
      summary: Создать запись об угрозе
      description: |
        Создаёт запись с уникальным MD5. Уникальность не зависит от регистра,
        в том числе при одновременных запросах. Если MD5 уже существует,
        возвращается 409.

        Поля md5 и name обязательны. Отсутствующее description заменяется
        пустой строкой, threat_type и severity — значением unknown.
        Отсутствующее или равное null поле file_size означает неизвестный
        размер. Ноль означает известный размер файла.

        Сервер присваивает created_at и updated_at одинаковое время создания.
        Обе временные метки запрещены в теле запроса.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
            examples:
              minimal:
                summary: Создать запись со значениями по умолчанию для необязательных полей
                value:
                  md5: d41d8cd98f00b204e9800998ecf8427e
                  name: Trojan.Win32.Generic
              full:
                summary: Создать запись с неизвестным размером файла
                value:
                  md5: D41D8CD98F00B204E9800998ECF8427E
                  name: Trojan.Win32.Generic
                  description: Collects saved browser passwords.
                  threat_type: trojan
                  severity: high
                  file_size: null
      responses:
        '201':
          description: Угроза создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
              examples:
                threat:
                  $ref: '#/components/examples/Threat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Общий API-ключ, настроенный оператором сервиса.
  parameters:
    Md5Path:
      name: md5
      in: path
      required: true
      description: MD5 файла. Допускаются шестнадцатеричные символы в обоих регистрах.
      schema:
        $ref: '#/components/schemas/Md5'
  schemas:
    Md5:
      type: string
      pattern: '^[a-fA-F0-9]{32}$'
      description: MD5 файла из 32 шестнадцатеричных символов.
      example: d41d8cd98f00b204e9800998ecf8427e
    CanonicalMd5:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: Неизменяемый MD5 файла в нижнем регистре.
      example: d41d8cd98f00b204e9800998ecf8427e
    ThreatName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\x00]*[^ \t\r\n\f\v\x00][^\x00]*$'
      description: Название угрозы. Должен присутствовать хотя бы один символ, не являющийся пробельным символом ASCII. NUL запрещён. Сохраняется без изменений.
      example: Trojan.Win32.Generic
    ThreatDescription:
      type: string
      maxLength: 2000
      pattern: '^[^\x00]*$'
      default: ''
      description: Описание угрозы. Отсутствующее поле означает пустую строку; null и NUL запрещены.
      example: Collects saved browser passwords.
    ThreatType:
      type: string
      enum:
        - trojan
        - worm
        - ransomware
        - spyware
        - other
        - unknown
      default: unknown
      description: Основная категория угрозы, заданная клиентом. Отсутствующее поле означает unknown; null запрещён.
      example: trojan
    Severity:
      type: string
      enum:
        - unknown
        - low
        - medium
        - high
      default: unknown
      description: Уровень опасности, оценённый клиентом. Отсутствующее поле означает unknown; null запрещён.
      example: high
    FileSize:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      nullable: true
      description: Размер файла в байтах. Отсутствующее поле или null означает неизвестный размер; ноль — известный размер.
      example: 4096
    ThreatCreateRequest:
      type: object
      additionalProperties: false
      required:
        - md5
        - name
      properties:
        md5:
          $ref: '#/components/schemas/Md5'
        name:
          $ref: '#/components/schemas/ThreatName'
        description:
          $ref: '#/components/schemas/ThreatDescription'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        file_size:
          $ref: '#/components/schemas/FileSize'
    ThreatUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/ThreatName'
        description:
          $ref: '#/components/schemas/ThreatDescription'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        file_size:
          $ref: '#/components/schemas/FileSize'
    ThreatResponse:
      type: object
      additionalProperties: false
      required:
        - md5
        - name
        - description
        - threat_type
        - severity
        - file_size
        - created_at
        - updated_at
      properties:
        md5:
          $ref: '#/components/schemas/CanonicalMd5'
        name:
          $ref: '#/components/schemas/ThreatName'
        description:
          $ref: '#/components/schemas/ThreatDescription'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        file_size:
          $ref: '#/components/schemas/FileSize'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Время создания на сервере в UTC, формат RFC 3339. Не меняется.
          example: '2026-11-06T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Время последнего изменения данных на сервере в UTC, формат RFC 3339. При создании равно created_at.
          example: '2026-11-06T10:00:00Z'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: Краткое сообщение об ошибке, безопасное для передачи клиенту.
          example: Threat not found
        details:
          type: string
          description: Необязательное безопасное пояснение. Не содержит ошибок БД, учётных данных или внутренних сведений.
          example: No threat matches the provided MD5.
  responses:
    BadRequest:
      description: |
        Некорректный MD5, отсутствие обязательного тела или поля,
        некорректный JSON, неизвестное поле или нарушение схемы данных.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Invalid request
            details: name must contain a character other than ASCII whitespace.
    Unauthorized:
      description: API-ключ отсутствует или неверен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthorized
    NotFound:
      description: Угроза с указанным MD5 не найдена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Threat not found
    Conflict:
      description: Угроза с этим MD5 уже существует; регистр символов не учитывается.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Threat already exists
    ContentTooLarge:
      description: Тело запроса превышает ограничение, настроенное оператором сервиса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Request body too large
    UnsupportedMediaType:
      description: В непустом запросе на запись отсутствует или не поддерживается Content-Type. Используйте application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unsupported media type
            details: Use Content-Type application/json.
    TooManyRequests:
      description: Превышено общее ограничение частоты запросов для экземпляра сервиса. Ограничение настраивается.
      headers:
        Retry-After:
          description: Ожидание до повторного запроса в целых секундах. Всегда присутствует в этом ответе.
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Too many requests
    InternalServerError:
      description: Непредвиденная ошибка сервера. Технические подробности записываются в журнал и не передаются клиенту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Internal server error
  examples:
    Threat:
      summary: Полная запись с неизвестным размером файла
      value:
        md5: d41d8cd98f00b204e9800998ecf8427e
        name: Trojan.Win32.Generic
        description: Collects saved browser passwords.
        threat_type: trojan
        severity: high
        file_size: null
        created_at: '2026-11-06T10:00:00Z'
        updated_at: '2026-11-06T10:00:00Z'
