name: threat-info

x-app: &app
  image: threat-info-service:local
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-database-url: &database-url "postgres://threats:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/threats?sslmode=disable"

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: threats
      POSTGRES_USER: threats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: *database-url
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    build:
      context: .
    command: ["/app/server"]
    environment:
      DATABASE_URL: *database-url
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      HTTP_ADDR: :8080
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10s}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-16384}
      RATE_LIMIT: ${RATE_LIMIT:-10}
      RATE_BURST: ${RATE_BURST:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
