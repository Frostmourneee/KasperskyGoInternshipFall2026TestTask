version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/storage/postgres/queries
    gen:
      go:
        package: db
        out: internal/storage/postgres/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
